## Source OS images from which to clone.  NOTE: For AWS, the explicit AMIs are region-specific.
#_ubuntu2204image: "ami-0c0aa81a5fab62093"                                          # eu-west-1 22.04 amd64 hvm-ssd 20220616.  Ubuntu AMIs can be located at https://cloud-images.ubuntu.com/locator/
_ubuntu2604image: "amazon/ubuntu/images-testing/hvm-ssd-gp3/ubuntu-resolute-daily-amd64-server-*"        # Latest Ubuntu Resolute Raccoon (26.04.x) image
_ubuntu2404image: "amazon/ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-*"           # Latest Ubuntu Noble Numbat (24.04.x) image
_ubuntu2204image: "amazon/ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-*"               # Latest Ubuntu Jammy Jellyfish (22.04.x) image
_ubuntu2004image: "amazon/ubuntu-pro-server/images/hvm-ssd/ubuntu-focal-20.04-*"    # Latest Ubuntu Focal Fossa (20.04.x) image ('pro-server', because 20.04 is out of standard support)
_ubuntu1804image: "amazon/ubuntu-pro-server/images/hvm-ssd/ubuntu-bionic-18.04-*"   # Latest Ubuntu Bionic Beaver (18.04.x) image ('pro-server', because 18.04 is out of standard support)
_ubuntu1604image: "amazon/ubuntu-pro-server/images/hvm-ssd/ubuntu-xenial-16.04-*"   # Latest Ubuntu Xenial Xerus (16.04.x) image ('pro-server', because 16.04 is out of standard support)
_rhel10image: "amazon/RHEL-10.0.0_HVM_GA-*-x86_64-0-Hourly2-GP3"                    # Latest official Red Hat Enterprise Linux 10.x image
_alma10image: "aws-marketplace/AlmaLinux OS 10.*"                                   # Latest official AlmaLinux 10.x image

cluster_vars:
  image: "{{_ubuntu2604image}}"
