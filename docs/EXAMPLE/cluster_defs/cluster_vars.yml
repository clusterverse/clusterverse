---

redeploy_schemes_supported: ['_scheme_addallnew_rmdisk_rollback', '_scheme_addnewvm_rmdisk_rollback', '_scheme_rmvm_rmdisk_only', '_scheme_rmvm_keepdisk_rollback', '_scheme_noredeploy_scale_in_only']

#omit_singleton_hosttype_from_hostname: true             # If we don't want the hosttype in the hostname (only valid if there's only one hosttype), e.g. 'bastion-dev-sys-euw1-a0' vs 'bastion-dev-euw1-a0'.  Default false (ansible_collections/clusterverse/clusterverse/roles/_dependencies/defaults/main.yml)
#omit_singleton_region_from_hostname: true               # If we don't want the region in the hostname (only valid if there's only one region), e.g. 'bastion-dev-sys-euw1-a0' vs 'bastion-dev-sys-a0'.  Default false (ansible_collections/clusterverse/clusterverse/roles/_dependencies/defaults/main.yml)

app_name: "{{lookup('pipe', 'whoami') | lower}}-test"   # The name of the application cluster (e.g. 'couchbase', 'nginx'); becomes part of cluster_name.  Provided is a default to ensure no accidental overwriting.

cluster_name: "{{app_name}}-{{buildenv}}"               # Identifies the cluster within the cloud environment; becomes part of the hostname

cluster_vars:
  custom_tagslabels:
    environment: "{{buildenv}}"
    owner: "{{ lookup('pipe', 'whoami') | lower }}"
