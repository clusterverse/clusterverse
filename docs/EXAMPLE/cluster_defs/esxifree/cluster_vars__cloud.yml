---

_scheme_rmvm_keepdisk_rollback__copy_or_move: "move"

## Source OS images from which to clone.
#_ubuntu2204image: "gold-ubuntu2404-20240515082201"           # Specific Noble Numbat (24.04.x) image
base_image_latest_ubuntu2604: "gold-ubuntu2604-.*"            # Latest Ubuntu Resolute Raccoon (26.04.x) image
base_image_latest_ubuntu2404: "gold-ubuntu2404-.*"            # Latest Ubuntu Noble Numbat (24.04.x) image
base_image_latest_ubuntu2204: "gold-ubuntu2204-.*"            # Latest Ubuntu Jammy Jellyfish (22.04.x) image
base_image_latest_ubuntu2004: "gold-ubuntu2004-.*"            # Latest Ubuntu Focal Fossa (20.04.x) image
base_image_latest_ubuntu1804: "gold-ubuntu1804-.*"            # Latest Ubuntu Bionic Beaver (18.04.x) image
base_image_latest_alma10: "gold-alma10.*"                     # Latest AlmaLinux 10.x image


cluster_vars:
  base_image: "{{base_image_latest_ubuntu2604}}"
  dns_nameserver_zone: ""                                     # The apex zone that dns_server will operate on.  gcloud dns needs a trailing '.'; leave blank for no DNS (IPs only)
  dns_subdomain: "{{cloud_type}}.{{buildenv}}"                # A user-defined subdomain part of the FDQN, (e.g. if more labels are required before the dns_nameserver_zone)
  # dns_domain: (composed of dns_subdomain.dns_nameserver_zone) is defined in clusterverse/clusterverse/roles/_dependencies/defaults/main.yml
  dns_server: ""                                              # Specify DNS server. nsupdate, route53 or clouddns.  If empty string is specified, no DNS will be added.
  inventory_ip: "private"                                     # 'public' or 'private', (private in case we're operating in a private LAN).  If public, 'assign_public_ip' must be 'static' or 'dynamic'
  esxi:
    esxi_ip: ""                                               # ip/hostname of ESXi hypervisor
    username: ""                                              # username of a user with esxi permissions
    password: "{{ lookup('env', 'ESXI_PASSWORD') | default ('') }}"    # NOTE: This can either be sourced from environment (ESXI_PASSWORD), or defined inline here (perhaps vaulted).
    datastore: "vdisks"
    hardware_version: "19"
    delete_cloudinit: true                                    # Whether to remove the cloudinit package after first boot, to prevent it interfering with subsequent boots
    cloudinit_userdata:
      users:
        - name: ansible
          # The public key is derived from the private key (ssh_keygen -y -f <privkey>), which is either provided on the command line (via '--private-key', which creates the ansible variable 'ansible_ssh_private_key_file'), or as a variable in cluster_vars[buildenv].ssh_connection_cfg.host.ansible_ssh_private_key_contents (anchored to _host_ssh_connection_cfg.ansible_ssh_private_key_contents), which itself can be derived from `ANSIBLE_SSH_PRIVATE_KEY_CONTENTS` environment variable.
          ssh_authorized_keys: [ "{%- if _host_ssh_connection_cfg.ansible_ssh_private_key_contents -%}{{ lookup('pipe', 'ssh-keygen -y -f /dev/stdin <<SSHFILE\n' ~ _host_ssh_connection_cfg.ansible_ssh_private_key_contents | replace('\\n','\n') ~ '\nSSHFILE') }}{%- elif ansible_ssh_private_key_file is defined -%}{{ lookup('pipe', 'ssh-keygen -y -f ' ~ ansible_ssh_private_key_file) }}{%- endif -%}" ]
          sudo: "ALL=(ALL) NOPASSWD:ALL"
          lock_passwd: true
          shell: /bin/bash
      runcmd: "{{ ['sh', '-c', 'if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get -y dist-upgrade && apt-get -y autoclean && apt-get -y autoremove; elif command -v dnf >/dev/null 2>&1; then dnf -y upgrade --refresh && dnf -y autoremove && dnf clean all; elif command -v yum >/dev/null 2>&1; then yum -y update && yum -y autoremove && yum clean all; fi'] if (update_os is defined and update_os | bool) else '' }}"
#      swap: { filename: /swap.img, size: auto, maxsize: 4G }     # Add new swap file
#      mounts: [ [ swap, null ] ]                                 # Delete preexisting swap file
