---

# Note: Azure, irritatingly, doesn't provide all the info we need for cluster_hosts_state/dynamic_inventory in one place. We have to run each of these, passing the results of the previous into the next.
#  + VM info: azure_rm_virtualmachine_info
#  + Private IP info: azure_rm_networkinterface_info
#  + Public IP info: azure_rm_publicipaddress_info

- name: get_cluster_hosts_state/azure | Get existing instance info across all regional resource groups
  azure.azcollection.azure_rm_virtualmachine_info:
    client_id: "{{cluster_vars[buildenv].azure_client_id | default(omit) }}"
    secret: "{{cluster_vars[buildenv].azure_secret | default(omit) }}"
    subscription_id: "{{cluster_vars[buildenv].azure_subscription_id | default(omit) }}"
    tenant: "{{cluster_vars[buildenv].azure_tenant | default(omit) }}"
    resource_group: "{{ item }}"
    tags:
      - "cv__cluster_name:{{cluster_name}}"
  loop: "{{ (cluster_vars[buildenv].hosttype_vars | json_query(\"*.region_vars.*.resource_group[]\") ) | unique }}"
  register: r__azure_rm_virtualmachine_info
  delegate_to: localhost
  run_once: true

#- name: get_cluster_hosts_state/azure | r__azure_rm_virtualmachine_info
#  debug: msg="{{r__azure_rm_virtualmachine_info}}"
#  delegate_to: localhost
#  run_once: true

- name: get_cluster_hosts_state/azure | Get network interface info (per instance)
  azure.azcollection.azure_rm_networkinterface_info:
    client_id: "{{cluster_vars[buildenv].azure_client_id | default(omit) }}"
    secret: "{{cluster_vars[buildenv].azure_secret | default(omit) }}"
    subscription_id: "{{cluster_vars[buildenv].azure_subscription_id | default(omit) }}"
    tenant: "{{cluster_vars[buildenv].azure_tenant | default(omit) }}"
    resource_group: "{{ item.resource_group }}"
    name: "{{ item.networkInterface }}"
  with_items: "{{ _azure_vms_flat }}"
  vars:
    _azure_vms_flat: |
      {%- set ns = namespace(res=[]) -%}
      {%- for rg_result in r__azure_rm_virtualmachine_info.results -%}
        {%- set resource_group = rg_result.item -%}
        {%- for vm in (rg_result.vms | default([])) -%}
          {%- set zone = (vm.zones[0] | default('')) | string -%}
          {%- set ns.res = ns.res + [{
            'name': vm.name,
            'region': vm.location,
            'regionzone': (vm.location ~ '-' ~ zone) if zone else vm.location,
            'tagslabels': vm.tags,
            'instance_id': vm.id,
            'instance_state': vm.power_state,
            'networkInterface': vm.network_interface_names[0],
            'base_image': vm.image | default(None),
            'resource_group': resource_group
          }] -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.res }}
  register: r__azure_rm_networkinterface_info
  delegate_to: localhost
  run_once: true
  async: 7200
  poll: 0

- name: get_cluster_hosts_state/azure | Wait for network interface info
  async_status: { jid: "{{ item.ansible_job_id }}" }
  register: r__async_status__azure_rm_networkinterface_info
  until: r__async_status__azure_rm_networkinterface_info is finished
  delay: 3
  retries: 300
  with_items: "{{r__azure_rm_networkinterface_info.results}}"
  delegate_to: localhost
  run_once: true

#- name: get_cluster_hosts_state/azure | r__async_status__azure_rm_networkinterface_info
#  debug: msg="{{r__async_status__azure_rm_networkinterface_info}}"
#  delegate_to: localhost
#  run_once: true


- name: get_cluster_hosts_state/azure | Get publicipaddress info (per instance)
  azure.azcollection.azure_rm_publicipaddress_info:
    client_id: "{{cluster_vars[buildenv].azure_client_id | default(omit) }}"
    secret: "{{cluster_vars[buildenv].azure_secret | default(omit) }}"
    subscription_id: "{{cluster_vars[buildenv].azure_subscription_id | default(omit) }}"
    tenant: "{{cluster_vars[buildenv].azure_tenant | default(omit) }}"
    resource_group: "{{ item.item.item.resource_group }}"
    name: "{{ item.networkinterfaces[0].ip_configurations[0].public_ip_address | basename }}"
  with_items: "{{ r__async_status__azure_rm_networkinterface_info.results }}"
  register: r__azure_rm_publicipaddress_info
  delegate_to: localhost
  run_once: true
  async: 7200
  poll: 0
  when: item.networkinterfaces is defined and item.networkinterfaces | length > 0 and item.networkinterfaces[0].ip_configurations[0].public_ip_address is defined

- name: get_cluster_hosts_state/azure | Wait for publicipaddress info
  async_status: { jid: "{{ item.ansible_job_id }}" }
  register: r__async_status__azure_rm_publicipaddress_info
  until: r__async_status__azure_rm_publicipaddress_info is finished
  delay: 3
  retries: 300
  with_items: "{{ r__azure_rm_publicipaddress_info.results | selectattr('ansible_job_id', 'defined') | list }}"
  delegate_to: localhost
  run_once: true

#- name: get_cluster_hosts_state/azure | r__async_status__azure_rm_publicipaddress_info
#  debug: msg="{{r__async_status__azure_rm_publicipaddress_info}}"
#  delegate_to: localhost
#  run_once: true

- name: get_cluster_hosts_state/azure | Set cluster_hosts_state
  set_fact:
    cluster_hosts_state: |
      {%- set ns = namespace(res=[]) -%}
      {%- for nic_result in r__async_status__azure_rm_networkinterface_info.results -%}
        {%- set vm = nic_result.item.item -%}
        {%- set private_ip = nic_result.networkinterfaces[0].ip_configurations[0].private_ip_address | default(None) -%}
        {%- set ns_ip = namespace(public=None) -%}
        {%- for pip_result in (r__async_status__azure_rm_publicipaddress_info.results | default([])) -%}
          {%- if pip_result.skipped is not defined and pip_result.item is defined and pip_result.item.item is defined and pip_result.item.item.item.item.name == vm.name and pip_result.item.item.item.item.region == vm.region -%}
            {%- set ns_ip.public = pip_result.publicipaddresses[0].ip_address | default(None) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set ipv4 = {'private': private_ip} -%}
        {%- if ns_ip.public -%}
          {%- set ipv4 = ipv4 | combine({'public': ns_ip.public}) -%}
        {%- endif -%}
        {%- set ns.res = ns.res + [{
          'name': vm.name,
          'region': vm.region,
          'regionzone': vm.regionzone,
          'tagslabels': vm.tagslabels,
          'instance_id': vm.instance_id,
          'instance_state': vm.instance_state,
          'ipv4': ipv4,
          'base_image': vm.base_image,
          'resource_group': vm.resource_group
        }] -%}
      {%- endfor -%}
      {{ ns.res }}

- name: get_cluster_hosts_state/azure | debug cluster_hosts_state
  debug: msg="{{cluster_hosts_state}}"
  delegate_to: localhost
  run_once: true
  when: cluster_hosts_state is defined
