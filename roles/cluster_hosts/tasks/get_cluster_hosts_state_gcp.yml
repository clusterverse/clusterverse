---

- name: get_cluster_hosts_state/gcp | Get existing instance info across all cluster regions/zones
  google.cloud.gcp_compute_instance_info:
    auth_kind: "serviceaccount"
    service_account_contents: "{{cluster_vars[buildenv].gcp_service_account_contents | string}}"   # NOTE: We need to cast this vault-derived variable to a string so that the register variable doesn't obfuscate the secret values, which then can't be used in later tasks.
    project: "{{cluster_vars[buildenv].vpc_project_id}}"
    zone: "{{ item }}"
    filters: [ "labels.cv__cluster_name = {{cluster_name}}" ]
    scopes: ["https://www.googleapis.com/auth/compute.readonly"]
  with_items: "{{ _gcp_regionzones }}"
  vars:
    # Flatten unique region-zone names (e.g. europe-west4-a) from hosttype region_vars (include zero-count zones so scale-in/destroy still finds VMs)
    _gcp_regionzones: |-
      {%- set ns = namespace(res=[]) -%}
      {%- for hosttype, htval in cluster_vars[buildenv].hosttype_vars.items() -%}
        {%- for region, rval in htval.region_vars.items() -%}
          {%- for zone in rval.vms_by_zone.keys() -%}
            {%- set rz = region ~ '-' ~ (zone | string) -%}
            {%- if rz not in ns.res -%}
              {%- set ns.res = ns.res + [rz] -%}
            {%- endif -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.res }}
  register: r__gcp_compute_instance_info
  delegate_to: localhost
  run_once: true

- name: get_cluster_hosts_state/gcp | Get root volume info (for image)
  google.cloud.gcp_compute_disk_info:
    auth_kind: "serviceaccount"
    service_account_contents: "{{cluster_vars[buildenv].gcp_service_account_contents | string}}"   # NOTE: We need to cast this vault-derived variable to a string so that the register variable doesn't obfuscate the secret values, which then can't be used in later tasks.
    project: "{{cluster_vars[buildenv].vpc_project_id}}"
    zone: "{{item.zone | basename }}"
    filters: [ "name = {{ item.bootdisk }}" ]
    scopes: ["https://www.googleapis.com/auth/compute.readonly"]
  register: r__gcp_compute_disk_info
  with_items: "{{ r__gcp_compute_instance_info.results | json_query(\"[?resources[?labels]].resources[].{name: name, bootdisk: disks[?boot].deviceName | [0], zone: zone }\") }}"
  delegate_to: localhost
  run_once: true

- name: get_cluster_hosts_state/gcp | Set cluster_hosts_state with correct region/regionzone (remove url)
  ansible.builtin.set_fact:
    cluster_hosts_state: |
      {%- set ns = namespace(res=[]) -%}
      {%- set initial_hosts = r__gcp_compute_instance_info.results | json_query('[?resources[?labels]].resources[].{name: name, regionzone: zone, tagslabels: labels, instance_id: id, instance_state: status, ipv4: {private: networkInterfaces[0].networkIP, public: networkInterfaces[0].accessConfigs[0].natIP}, disk_info_cloud: disks}') -%}
      {%- for cluster_host in initial_hosts -%}
        {%- set regionzone = cluster_host.regionzone | basename -%}
        {%- set updated_host = cluster_host | combine({
          'regionzone': regionzone,
          'region': regionzone.rsplit('-', 1)[0],
          'base_image': r__gcp_compute_disk_info.results | json_query('[?item.name==\'' + cluster_host.name + '\'].resources[].sourceImage | [0]')
        }) -%}
        {%- set ns.res = ns.res + [updated_host] -%}
      {%- endfor -%}
      {{ ns.res }}

- name: get_cluster_hosts_state/gcp | debug cluster_hosts_state
  debug: msg="{{cluster_hosts_state}}"
  delegate_to: localhost
  run_once: true
  when: cluster_hosts_state is defined
