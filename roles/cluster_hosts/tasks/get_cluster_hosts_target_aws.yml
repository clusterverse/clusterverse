---

- name: get_cluster_hosts_target/aws | Looking up VPC facts to extract ID (unique region/vpc_name pairs)
  amazon.aws.ec2_vpc_net_info:
    access_key: "{{cluster_vars[buildenv].aws_access_key | default(omit)}}"
    secret_key: "{{cluster_vars[buildenv].aws_secret_key | default(omit)}}"
    session_token: "{{cluster_vars[buildenv].aws_session_token | default(omit)}}"
    region: "{{ item.region }}"
    filters:
      "tag:Name": "{{ item.vpc_name }}"
  register: r__ec2_vpc_net_info
  delegate_to: localhost
  run_once: true
  loop: "{{ _aws_region_vpc_pairs }}"
  vars:
    # json_query('*.region_vars') returns a *list* of dicts (one per hosttype); build unique {region,vpc_name} pairs instead
    _aws_region_vpc_pairs: |
      {%- set ns = namespace(res=[]) -%}
      {%- for ht, htval in cluster_vars[buildenv].hosttype_vars.items() -%}
        {%- for region, rval in htval.region_vars.items() -%}
          {%- set pair = {'region': region, 'vpc_name': rval.vpc_name} -%}
          {%- if pair not in ns.res -%}
            {%- set ns.res = ns.res + [pair] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ ns.res }}

#- name: get_cluster_hosts_target/aws | debug r__ec2_vpc_net_info
#  debug: var=r__ec2_vpc_net_info

- name: get_cluster_hosts_target/aws | Assert that each expected VPC was found/visible
  assert:
    that: item.vpcs | default([]) | length > 0
    fail_msg: "VPC '{{ item.item.vpc_name }}' not found in region '{{ item.item.region }}'"
  loop: "{{ r__ec2_vpc_net_info.results }}"
  delegate_to: localhost
  run_once: true


- name: get_cluster_hosts_target/aws | Add subnet ids to cluster_hosts_target
  block:
    - name: get_cluster_hosts_target/aws | Look up vpc subnet facts
      amazon.aws.ec2_vpc_subnet_info:
        access_key: "{{cluster_vars[buildenv].aws_access_key | default(omit)}}"
        secret_key: "{{cluster_vars[buildenv].aws_secret_key | default(omit)}}"
        session_token: "{{cluster_vars[buildenv].aws_session_token | default(omit)}}"
        region: "{{ item.0.region }}"
        filters:
          vpc-id: "{{ item.1.vpc_id }}"
      register: r__ec2_vpc_subnet_info
      delegate_to: localhost
      run_once: true
      with_subelements:
        - "{{ r__ec2_vpc_net_info.results | json_query('[].{region: item.region, vpcs: vpcs[]}') }}"
        - vpcs

#    - name: get_cluster_hosts_target/aws | debug r__ec2_vpc_subnet_info
#      debug: var=r__ec2_vpc_subnet_info

    - name: get_cluster_hosts_target/aws | Update cluster_hosts_target with vpc and subnet ids
      ansible.builtin.set_fact:
        cluster_hosts_target: |
          {%- set ns = namespace(res=[]) -%}
          {%- for host in cluster_hosts_target -%}
            {%- set host_subnet = r__ec2_vpc_subnet_info.results | to_json | from_json | json_query('[].subnets[?availability_zone==\'' + host.region + host.az_name +'\' && starts_with(tags.Name, \'' + cluster_vars[buildenv].hosttype_vars[host.hosttype].region_vars[host.region].vpc_subnet_name_prefix + host.az_name +'\')][]|[0]') -%}
            {%- set updated_host = host | combine({'vpc_subnet_id': host_subnet.subnet_id, 'vpc_id': host_subnet.vpc_id }) -%}
            {%- set ns.res = ns.res + [updated_host] -%}
          {%- endfor -%}
          {{ ns.res }}

    - name: debug cluster_hosts_target post subnet_ids update
      debug: var=cluster_hosts_target


- name: get_cluster_hosts_target/aws | Add snapshot info (if found) to cluster_hosts_target
  block:
    - name: get_cluster_hosts_target/aws | Get snapshots info
      amazon.aws.ec2_snapshot_info:
        access_key: "{{cluster_vars[buildenv].aws_access_key | default(omit)}}"
        secret_key: "{{cluster_vars[buildenv].aws_secret_key | default(omit)}}"
        session_token: "{{cluster_vars[buildenv].aws_session_token | default(omit)}}"
        region: "{{ item }}"
        filters: "{{ _snapshot_tags[0] }}"
      register: r__ebs_snapshots
      delegate_to: localhost
      run_once: true
      loop: "{{ (cluster_vars[buildenv].hosttype_vars | json_query(\"*.region_vars.keys(@)[]\")) | unique }}"

    - name: get_cluster_hosts_target/aws | Assert that number of snapshots eq number of hosts
      assert:
        that: [ _available_snapshots|length == cluster_hosts_target|length ]
        fail_msg: "There are {{ _available_snapshots|length }} available snapshots and {{ cluster_hosts_target|length }} nodes. Snapshot restore available only to the same infrastructure size."
      vars:
        _available_snapshots: "{{ r__ebs_snapshots.results | map(attribute='snapshots') | flatten | map(attribute='snapshot_id') | list }}"
      delegate_to: localhost
      run_once: true

    ## [ See github.com/ansible/ansible/issues/27299 for reason for  '| to_json | from_json' ]
    - name: get_cluster_hosts_target/aws | update cluster_hosts_target with snapshot_id
      ansible.builtin.set_fact:
        cluster_hosts_target: |
          {%- set ns = namespace(res=[]) -%}
          {%- for host in cluster_hosts_target -%}
            {%- set cluster_host_topology = host.hostname | regex_replace('^.*(-.*?-).*$', '\\1') -%}
            {%- set ns_updated_volumes = namespace(volume=[]) -%}
            {%- for vol in host.auto_volumes -%}
              {%- set cur_snapshot = r__ebs_snapshots.results | default([]) | to_json | from_json | json_query('[].snapshots[?contains(tags.Name, \'' + cluster_host_topology + '\')][]') -%}
              {%- if cur_snapshot and 'snapshot_tags' in vol.keys() -%}
                {%- set updated_vol = vol | combine({'snapshot': cur_snapshot[0].snapshot_id}) | dict(vol.items() | reject('equalto', ('snapshot_tags', vol.snapshot_tags))) -%}
                {%- set ns_updated_volumes.volume = ns_updated_volumes.volume + [updated_vol] -%}
              {%- else -%}
                {%- set ns_updated_volumes.volume = ns_updated_volumes.volume + [vol] -%}
              {%- endif -%}
            {%- endfor -%}
            {%- set updated_host = host | combine({'auto_volumes': ns_updated_volumes.volume}) -%}
            {%- set ns.res = ns.res + [updated_host] -%}
          {%- endfor -%}
          {{ ns.res }}
  vars:
    _snapshot_tags: "{{ cluster_vars[buildenv].hosttype_vars|json_query('*.auto_volumes[].snapshot_tags')  }}"
  when: _snapshot_tags|length > 0


- name: get_cluster_hosts_target/aws | image can either be an AMI in its own right, or a 'manifest-location' filter to the latest AMI.
  block:
    - name: get_cluster_hosts_target/aws | Attempt to evaluate the image as an AMI
      amazon.aws.ec2_ami_info:
        access_key: "{{cluster_vars[buildenv].aws_access_key | default(omit)}}"
        secret_key: "{{cluster_vars[buildenv].aws_secret_key | default(omit)}}"
        session_token: "{{cluster_vars[buildenv].aws_session_token | default(omit)}}"
        region: "{{item__ec2_ami_info__by_imageid.region}}"
        filters: { image-id: "{{ item__ec2_ami_info__by_imageid.base_image }}" }
      register: r__ec2_ami_info__by_imageid
      loop: "{{ cluster_hosts_target }}"
      loop_control: { loop_var: item__ec2_ami_info__by_imageid }
      delegate_to: localhost
      run_once: true

#    - name: get_cluster_hosts_target/aws | debug r__ec2_ami_info__by_imageid
#      debug: var=r__ec2_ami_info__by_imageid

    - name: get_cluster_hosts_target/aws | Resolve non-AMI image filters via 'manifest-location'
      when: _cluster_hosts_targets__no_ami | length > 0
      block:
        - name: get_cluster_hosts_target/aws | _cluster_hosts_targets__no_ami
          debug: msg="{{ _cluster_hosts_targets__no_ami }}"
          delegate_to: localhost
          run_once: true

        - name: get_cluster_hosts_target/aws | Search the instance type info for the flavor of each hosttype's ami (to get architecture, needed for amazon.aws.ec2_ami_info)
          clusterverse.clusterverse.ec2_instance_type_info:
            access_key: "{{cluster_vars[buildenv].aws_access_key | default(omit)}}"
            secret_key: "{{cluster_vars[buildenv].aws_secret_key | default(omit)}}"
            session_token: "{{cluster_vars[buildenv].aws_session_token | default(omit)}}"
            region: "{{ item.0 }}"
            instance_types: "{{ item.1 | json_query('[].flavor') | unique }}"
          register: r__ec2_instance_type_info
          delegate_to: localhost
          run_once: true
          loop: "{{ _cluster_hosts_targets__no_ami | groupby('region') | map('list') | list }}"

#        - name: get_cluster_hosts_target/aws | debug r__ec2_instance_type_info
#          debug: msg={{r__ec2_instance_type_info}}

        - name: get_cluster_hosts_target/aws | Get the AMI per hosttype and filtered on 'manifest-location'
          amazon.aws.ec2_ami_info:
            access_key: "{{cluster_vars[buildenv].aws_access_key | default(omit)}}"
            secret_key: "{{cluster_vars[buildenv].aws_secret_key | default(omit)}}"
            session_token: "{{cluster_vars[buildenv].aws_session_token | default(omit)}}"
            region: "{{ item__ec2_ami_info__by_location.region }}"
            filters:
              manifest-location: "{{ item__ec2_ami_info__by_location.base_image }}"
              architecture: "{{ item__ec2_ami_info__by_location.derived_architecture | default('x86_64') }}"
          loop: "{{ _cluster_hosts_targets__derived_arch }}"
          loop_control: {loop_var: item__ec2_ami_info__by_location}
          vars:
            _cluster_hosts_targets__derived_arch: |-
              {%- set ns = namespace(res=[]) -%}
              {%- set _cluster_hosts_targets__derived_arch = _cluster_hosts_targets__no_ami -%}
              {%- for cht_host in _cluster_hosts_targets__derived_arch -%}
                {%- set hosttype_archs_ec2_instance_type_info = r__ec2_instance_type_info.results | json_query('[?instance_types[?instance_type==\'' + cht_host.flavor + '\'] && item[0]==\'' + cht_host.region + '\'].instance_types[].processor_info.supported_architectures[]') -%}
                {%- set ns_updated_host = namespace(host=cht_host) -%}
                {%- if hosttype_archs_ec2_instance_type_info | length == 1 -%}
                  {%- set ns_updated_host.host = cht_host | combine({'derived_architecture': hosttype_archs_ec2_instance_type_info[0]}) -%}
                {%- elif hosttype_archs_ec2_instance_type_info | symmetric_difference(['i386','x86_64']) | length == 0 -%}
                  {%- set ns_updated_host.host = cht_host | combine({'derived_architecture': 'x86_64'}) -%}
                {%- endif -%}
                {%- set ns.res = ns.res + [ns_updated_host.host] -%}
              {%- endfor -%}
              {{ ns.res }}
          register: r__ec2_ami_info__by_location
          delegate_to: localhost
          run_once: true

#        - name: debug r__ec2_ami_info__by_location
#          debug: var=r__ec2_ami_info__by_location

        - name: get_cluster_hosts_target/aws | Replace base_image with the latest AMI found at 'manifest-location'
          ansible.builtin.set_fact:
            cluster_hosts_target: |
              {%- set ns = namespace(res=[]) -%}
              {%- for cht_host in cluster_hosts_target -%}
                {%- set ns_updated_host = namespace(host=cht_host) -%}
                {%- for r__ec2_ami_info_host in r__ec2_ami_info__by_location.results -%}
                  {%- set src_host = r__ec2_ami_info_host[r__ec2_ami_info_host.ansible_loop_var] -%}
                  {%- if src_host.hostname == cht_host.hostname and src_host.region == cht_host.region -%}
                    {%- set ns_updated_host.host = cht_host | combine({ 'base_image': (r__ec2_ami_info_host.images | sort(attribute='creation_date'))[-1].image_id }) -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set ns.res = ns.res + [ns_updated_host.host] -%}
              {%- endfor -%}
              {{ ns.res }}
      vars:
        _cluster_hosts_targets__no_ami: |
          {%- set ns = namespace(res=[]) -%}
          {%- for host in r__ec2_ami_info__by_imageid.results -%}
            {%- if 'images' in host and host.images | length == 0 -%}
              {%- set ns.res = ns.res + [host[host.ansible_loop_var]] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.res }}

#    - name: get_cluster_hosts_target/aws | Ensure base_image is set for every host (explicit AMI id or previously resolved filter)
#      ansible.builtin.set_fact:
#        cluster_hosts_target: |
#          {%- set ns = namespace(res=[]) -%}
#          {%- for host in cluster_hosts_target -%}
#            {%- if host.base_image is defined and host.base_image -%}
#              {%- set ns.res = ns.res + [host] -%}
#            {%- else -%}
