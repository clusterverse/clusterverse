---

- name: create/libvirt | get xml per cluster_hosts_target (to get the root vol file type (qcow2 or raw))
  dseeley.libvirt.virt_volume:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    pool: "{{cluster_vars.libvirt.storage_pool}}"
    command: get_xml
    name: "{{item.base_image}}"
  loop: "{{ cluster_hosts_target }}"
  register: r__virt_volume__get_xml

#- name: create/libvirt | debug r__virt_volume__get_xml
#  debug: msg={{ r__virt_volume__get_xml }}

- name: create/libvirt | get the pool XML (for volume file paths)
  community.libvirt.virt_pool:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    name: "{{cluster_vars.libvirt.storage_pool}}"
    command: get_xml
  register: r__virt_pool__xml

- name: create/libvirt | clone root vol (when dest vdiskformat matches the gold image)
  dseeley.libvirt.virt_volume:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    pool: "{{cluster_vars.libvirt.storage_pool}}"
    state: present
    clone_source: "{{ item.item.base_image }}"
    xml: |-
      <volume type='file'>
        <name>{{ item.item.hostname }}--{{ _root_vol.device_name | default('boot') }}.{{ _dest_fmt }}</name>
      {% if _dest_size %}
        <capacity unit='G'>{{ _dest_size|int }}</capacity>
      {% endif %}
        <target><format type='{{ _dest_fmt }}'/></target>
      </volume>
  loop: "{{ r__virt_volume__get_xml.results }}"
  register: r__virt_volume__clone
  when: _dest_fmt == _src_fmt
  vars:
    _src_fmt: "{{ item.get_xml | clusterverse.clusterverse.xpath('/volume/target/format/@type') | first | default('raw') | lower }}"
    _root_vol: "{{ item.item.auto_volumes | default([]) | selectattr('mountpoint', 'equalto', '/') | list | first | default({}) }}"
    _dest_fmt: "{{ _root_vol.vdiskformat | default(_src_fmt) | lower }}"
    _dest_size: "{{ _root_vol.size_gb | default(item.item.os_disk_size_gb | default('')) }}"

- name: create/libvirt | convert root vol (when vdiskformat differs from the gold image)
  command: >-
    ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i id_rsa__cv_libvirt {{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}
    'if [ ! -f {{ _dest_path }} ]; then sudo qemu-img convert -O {{ _dest_fmt }} {{ _src_path }} {{ _dest_path }} && sudo chown --reference={{ _src_path }} {{ _dest_path }} && sudo chmod --reference={{ _src_path }} {{ _dest_path }}{% if _dest_size %} && sudo qemu-img resize {{ _dest_path }} {{ _dest_size|int }}G{% endif %} && echo CONVERTED; else echo EXISTS; fi'
  loop: "{{ r__virt_volume__get_xml.results }}"
  register: r__qemu_img_convert_root
  when: _dest_fmt != _src_fmt
  changed_when: "'CONVERTED' in (r__qemu_img_convert_root.stdout | default(''))"
  vars:
    _src_fmt: "{{ item.get_xml | clusterverse.clusterverse.xpath('/volume/target/format/@type') | first | default('raw') | lower }}"
    _root_vol: "{{ item.item.auto_volumes | default([]) | selectattr('mountpoint', 'equalto', '/') | list | first | default({}) }}"
    _dest_fmt: "{{ _root_vol.vdiskformat | default(_src_fmt) | lower }}"
    _dest_size: "{{ _root_vol.size_gb | default(item.item.os_disk_size_gb | default('')) }}"
    _src_path: "{{ item.get_xml | clusterverse.clusterverse.xpath('/volume/target/path/text()') | first }}"
    _dest_path: "{{ r__virt_pool__xml.get_xml | clusterverse.clusterverse.xpath('/pool/target/path/text()') | first }}/{{ item.item.hostname }}--{{ _root_vol.device_name | default('boot') }}.{{ _dest_fmt }}"

- name: create/libvirt | refresh the pool after root clone/convert
  community.libvirt.virt_pool:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    name: "{{cluster_vars.libvirt.storage_pool}}"
    command: refresh
  register: r__virt_pool_refresh_root
  until: r__virt_pool_refresh_root is success
  retries: 10

- name: create/libvirt | get root volume XML
  dseeley.libvirt.virt_volume:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    pool: "{{cluster_vars.libvirt.storage_pool}}"
    command: get_xml
    name: "{{ item.item.hostname }}--{{ _root_vol.device_name | default('boot') }}.{{ _dest_fmt }}"
  loop: "{{ r__virt_volume__get_xml.results }}"
  register: r__virt_volume__getxml_root
  until: r__virt_volume__getxml_root.get_xml is string
  retries: 10
  delay: 1
  failed_when: r__virt_volume__getxml_root.get_xml is not string
  vars:
    _src_fmt: "{{ item.get_xml | clusterverse.clusterverse.xpath('/volume/target/format/@type') | first | default('raw') | lower }}"
    _root_vol: "{{ item.item.auto_volumes | default([]) | selectattr('mountpoint', 'equalto', '/') | list | first | default({}) }}"
    _dest_fmt: "{{ _root_vol.vdiskformat | default(_src_fmt) | lower }}"

#- name: create/libvirt | debug r__virt_volume__clone
#  debug: msg={{ r__virt_volume__clone }}

- name: create, (or copy, or move) the non-root volumes
  block:
    - name: create/libvirt | CREATE NEW non-root vols
      dseeley.libvirt.virt_volume:
        uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
        pool: "{{cluster_vars.libvirt.storage_pool}}"
        state: present
        xml: |-
          <volume type='file'>
            <name>{{ item.0.hostname }}--{{ item.1.device_name }}.{{'raw' if item.1.vdiskformat is defined and item.1.vdiskformat=='raw' else 'qcow2'}}</name>
            <capacity unit='G'>{{ item.1.size_gb|int }}</capacity>
            <target><format type='{{'raw' if item.1.vdiskformat is defined and item.1.vdiskformat=='raw' else 'qcow2'}}'/></target>
          </volume>
      with_subelements:
        - "{{ cluster_hosts_target | json_query(\"[].{hostname: hostname, auto_volumes: auto_volumes[?mountpoint!=`/` && !src]}\") }}"
        - auto_volumes
      register: r__virt_volume__nonroot

#    - name: create/libvirt | r__virt_volume__nonroot
#      debug: msg={{ r__virt_volume__nonroot }}

    - name: create/libvirt | MOVE/COPY OLD non-root vols
      block:
        - name: "create/libvirt | {{_scheme_rmvm_keepdisk_rollback__copy_or_move}} OLD non-root vols"
          command: "ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i id_rsa__cv_libvirt {{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }} 'if [ ! -f {{_dest_non_rool_vol}} ]; then sudo {{'mv' if _scheme_rmvm_keepdisk_rollback__copy_or_move == 'move' else 'cp'}} {{ item.1.src.source_file }} {{_dest_non_rool_vol}}; fi'"
          vars:
            _dest_non_rool_vol: "{{r__virt_pool__xml.get_xml | clusterverse.clusterverse.xpath('/pool/target/path/text()') | first }}/{{ item.0.hostname }}--{{ item.1.device_name }}.{{'raw' if item.1.vdiskformat is defined and item.1.vdiskformat=='raw' else 'qcow2'}}"
          with_subelements:
            - "{{ cluster_hosts_target | json_query(\"[].{hostname: hostname, auto_volumes: auto_volumes[?src]}\") }}"
            - auto_volumes
          register: r__virt_volume__nonroot_mv

#        - name: create/libvirt | r__virt_volume__nonroot_mv
#          debug: msg={{ r__virt_volume__nonroot_mv }}

        - name: create/libvirt | refresh the pool
          community.libvirt.virt_pool:
            uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
            name: "{{cluster_vars.libvirt.storage_pool}}"
            command: refresh
          register: r__virt_pool
          until: r__virt_pool is success
          retries: 10
      when: "redeploy_scheme is defined  and  redeploy_scheme == '_scheme_rmvm_keepdisk_rollback'"

    - name: create/libvirt | get non-root volume XML
      dseeley.libvirt.virt_volume:
        uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
        pool: "{{cluster_vars.libvirt.storage_pool}}"
        command: get_xml
        name: "{{ item.0.hostname }}--{{ item.1.device_name }}.{{'raw' if item.1.vdiskformat is defined and item.1.vdiskformat=='raw' else 'qcow2'}}"
      with_subelements:
        - "{{ cluster_hosts_target | json_query(\"[].{hostname: hostname, auto_volumes: auto_volumes[?mountpoint!=`/`]}\") }}"
        - auto_volumes
      register: r__virt_volume__getxml_nonroot
      until: r__virt_volume__getxml_nonroot.get_xml is string
      retries: 10
      delay: 1
      failed_when: r__virt_volume__getxml_nonroot.get_xml is not string

#    - name: create/libvirt | debug r__virt_volume__nonroot
#      debug: msg={{ r__virt_volume__getxml_nonroot }}

- name: create/libvirt | debug disks
  debug: msg="{{ disks | from_json }}"
  vars:
    disks: |-
      {%- set disk_ns = namespace(scsi=0, sata=0, virtio=0) -%}
      {%- set _root_vol = item.auto_volumes | default([]) | selectattr('mountpoint', 'equalto', '/') | list | first | default({}) -%}
      {%- set root_res = r__virt_volume__getxml_root.results | json_query("[?item.item.hostname=='" + item.hostname + "']") | first -%}
      {%- set nonroot_disks = r__virt_volume__getxml_nonroot.results | json_query("[?item[0].hostname=='" + item.hostname + "']") -%}
      {%- set _root_iface = (_root_vol.interface | default('SCSI')) | lower -%}
      {%- set _root_bus = {'virtio': 'virtio', 'sata': 'sata'}.get(_root_iface, 'scsi') -%}
      {%- set _root_idx = disk_ns.virtio if _root_bus == 'virtio' else (disk_ns.sata if _root_bus == 'sata' else disk_ns.scsi) -%}
      {%- set _root_dev = ('vd' if _root_bus == 'virtio' else 'sd') ~ ((_root_idx + 97) | clusterverse.clusterverse.tochr) -%}
      {%- if _root_bus == 'virtio' %}{% set disk_ns.virtio = disk_ns.virtio + 1 %}{% elif _root_bus == 'sata' %}{% set disk_ns.sata = disk_ns.sata + 1 %}{% else %}{% set disk_ns.scsi = disk_ns.scsi + 1 %}{% endif -%}
      [
        {
          "path": "{{ root_res.get_xml | clusterverse.clusterverse.xpath('/volume/target/path/text()') | first }}",
          "bus": "{{ _root_bus }}",
          "driver": {
            "name": "qemu",
            "type": "{{ root_res.get_xml | clusterverse.clusterverse.xpath('/volume/target/format/@type') | first | default('raw') }}",
            "discard": "unmap"
          },
          "target": { "dev": "{{ _root_dev }}" },
          "serial": "{{ _root_vol.device_name | default('boot') }}"
        }
        {%- if nonroot_disks | length > 0 -%},
        {%- for vol in nonroot_disks -%}
        {%- set _iface = (vol.item[1].interface | default('SCSI')) | lower -%}
        {%- set _bus = {'virtio': 'virtio', 'sata': 'sata'}.get(_iface, 'scsi') -%}
        {%- set _idx = disk_ns.virtio if _bus == 'virtio' else (disk_ns.sata if _bus == 'sata' else disk_ns.scsi) -%}
        {%- set _dev = ('vd' if _bus == 'virtio' else 'sd') ~ ((_idx + 97) | clusterverse.clusterverse.tochr) -%}
        {%- if _bus == 'virtio' %}{% set disk_ns.virtio = disk_ns.virtio + 1 %}{% elif _bus == 'sata' %}{% set disk_ns.sata = disk_ns.sata + 1 %}{% else %}{% set disk_ns.scsi = disk_ns.scsi + 1 %}{% endif -%}
        {
          "path": "{{ vol.get_xml | clusterverse.clusterverse.xpath('/volume/target/path/text()') | first }}",
          "bus": "{{ _bus }}",
          "driver": {
            "name": "qemu",
            "type": "{{ 'raw' if vol.item[1].vdiskformat is defined and vol.item[1].vdiskformat == 'raw' else 'qcow2' }}",
            "discard": "unmap"
          },
          "target": { "dev": "{{ _dev }}" },
          "serial": "{{ vol.item[1].device_name }}"
        }{{ "," if not loop.last else "" }}
        {%- endfor -%}
        {%- endif -%}
      ]
  with_items: "{{ cluster_hosts_target }}"


- name: create/libvirt | debug networks
  block:
    - name: debug 1
      debug: msg="{{ networks  }}"
      with_items: "{{ cluster_hosts_target }}"

    - name: debug 2
      debug: msg="{{ networks | from_json }}"
      with_items: "{{ cluster_hosts_target }}"
  vars:
    networks: |-
      {%- if item | json_query('networks[]') | length >0 -%}
        [
        {%- for iface in item.networks -%}
          {
          {%- if iface.interface_type == 'bridge' -%}
            "bridge": "{{iface.source_dev}}",
          {%- elif iface.interface_type == 'direct' -%}
            "source":
              {
                "value": "{{iface.source_dev}}",
                "mode": "{{iface.interface_type}}"
              },
          {%- endif -%}
            "model": {"type": "virtio"}
          }
        {%- endfor -%}
        ]
      {%- endif -%}


- name: create/libvirt | Provision VMs with virt_install
  community.libvirt.virt_install:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    name: "{{ item.hostname }}"
    memory: "{{ item.flavor.memory_mb }}"
    vcpus: "{{ item.flavor.num_cpus }}"
    machine: q35
    boot: "{{ 'uefi' if (item.flavor.firmware is not defined or item.flavor.firmware != 'BIOS') else omit }}"

    # Disks - root (cloned) + additional
    disks: "{{ _unparsed_disks | from_json }}"

    cloud_init:
      user_data: |
        #cloud-config
        {{ (cluster_vars.libvirt.cloudinit_userdata | default({}) | to_nice_yaml) | indent(2) }}
      meta_data: { "local-hostname": "{{item.hostname}}" }
      network_config: "{{ _cloudinit_network_config | default(omit) }}"  # your existing network logic
      disable: true   # to disable cloud-init on future boots

    networks: "{{ _unparsed_networks | from_json }}"

    osinfo: { name: ubuntu-lts-latest }

    # Extra hardware
    graphics: { type: vnc }
    video: { model: { type: qxl, ram: 65536, vram: 65536, vgamem: 16384, heads: 1 } }
    rng: { backend: { model: random, source: { path: /dev/urandom } } }
    tpm: { model: tpm-crb, backend: { type: emulator, version: '2.0' } }
    channel_devices: [ { type: unix, target: { type: virtio, name: org.qemu.guest_agent.0} } ]

    metadata:
      description: "{{ _tagslabels | combine(cluster_vars.custom_tagslabels | default({})) | to_json }}"  # approximate

    state: present
    import: true          # use pre-created disks
    autostart: "{{ item.flavor.autostart | default(false) | bool }}"

  with_items: "{{ cluster_hosts_target }}"
  register: r__virt_install
#  async: 7200
#  poll: 0
  vars:
    _cloudinit_network_config: |
      {%- if item | json_query('networks[]') | length >0 -%}
        {%- set cidata_ns = namespace(cidata_network = {"version": 2}) -%}
        {%- for network in item.networks -%}
          {%- if ('cloudinit_netplan' not in network) or ('ethernets' not in network['cloudinit_netplan']) or ('wifis' not in network['cloudinit_netplan']) -%}
            {%- set cidata_ns.cidata_network = cidata_ns.cidata_network | combine({'ethernets': {'eth' + loop.index0|string: {'dhcp4': True}}}, recursive=True) -%}
          {%- endif -%}
          {%- if 'cloudinit_netplan' in network -%}
            {%- set cidata_ns.cidata_network = cidata_ns.cidata_network | combine(network['cloudinit_netplan'], recursive=True) -%}
          {%- endif -%}
        {%- endfor -%}
      {{cidata_ns.cidata_network}}
      {%- endif -%}
    _unparsed_networks: |-
      {%- if item | json_query('networks[]') | length >0 -%}
        [
        {%- for iface in item.networks -%}
          {
          {%- if iface.interface_type == 'bridge' -%}
            "bridge": "{{iface.source_dev}}",
          {%- elif iface.interface_type == 'direct' -%}
            "source":
              {
                "value": "{{iface.source_dev}}",
                "mode": "{{iface.interface_type}}"
              },
          {%- endif -%}
            "model": {"type": "virtio"}
          }
        {%- endfor -%}
        ]
      {%- endif -%}
    _unparsed_disks: |-
      {%- set disk_ns = namespace(scsi=0, sata=0, virtio=0) -%}
      {%- set _root_vol = item.auto_volumes | default([]) | selectattr('mountpoint', 'equalto', '/') | list | first | default({}) -%}
      {%- set root_res = r__virt_volume__getxml_root.results | json_query("[?item.item.hostname=='" + item.hostname + "']") | first -%}
      {%- set nonroot_disks = r__virt_volume__getxml_nonroot.results | json_query("[?item[0].hostname=='" + item.hostname + "']") -%}
      {%- set _root_iface = (_root_vol.interface | default('SCSI')) | lower -%}
      {%- set _root_bus = {'virtio': 'virtio', 'sata': 'sata'}.get(_root_iface, 'scsi') -%}
      {%- set _root_idx = disk_ns.virtio if _root_bus == 'virtio' else (disk_ns.sata if _root_bus == 'sata' else disk_ns.scsi) -%}
      {%- set _root_dev = ('vd' if _root_bus == 'virtio' else 'sd') ~ ((_root_idx + 97) | clusterverse.clusterverse.tochr) -%}
      {%- if _root_bus == 'virtio' %}{% set disk_ns.virtio = disk_ns.virtio + 1 %}{% elif _root_bus == 'sata' %}{% set disk_ns.sata = disk_ns.sata + 1 %}{% else %}{% set disk_ns.scsi = disk_ns.scsi + 1 %}{% endif -%}
      [
        {
          "path": "{{ root_res.get_xml | clusterverse.clusterverse.xpath('/volume/target/path/text()') | first }}",
          "bus": "{{ _root_bus }}",
          "driver": {
            "name": "qemu",
            "type": "{{ root_res.get_xml | clusterverse.clusterverse.xpath('/volume/target/format/@type') | first | default('raw') }}",
            "discard": "unmap"
          },
          "target": { "dev": "{{ _root_dev }}" },
          "serial": "{{ _root_vol.device_name | default('boot') }}"
        }
        {%- if nonroot_disks | length > 0 -%},
        {%- for vol in nonroot_disks -%}
        {%- set _iface = (vol.item[1].interface | default('SCSI')) | lower -%}
        {%- set _bus = {'virtio': 'virtio', 'sata': 'sata'}.get(_iface, 'scsi') -%}
        {%- set _idx = disk_ns.virtio if _bus == 'virtio' else (disk_ns.sata if _bus == 'sata' else disk_ns.scsi) -%}
        {%- set _dev = ('vd' if _bus == 'virtio' else 'sd') ~ ((_idx + 97) | clusterverse.clusterverse.tochr) -%}
        {%- if _bus == 'virtio' %}{% set disk_ns.virtio = disk_ns.virtio + 1 %}{% elif _bus == 'sata' %}{% set disk_ns.sata = disk_ns.sata + 1 %}{% else %}{% set disk_ns.scsi = disk_ns.scsi + 1 %}{% endif -%}
        {
          "path": "{{ vol.get_xml | clusterverse.clusterverse.xpath('/volume/target/path/text()') | first }}",
          "bus": "{{ _bus }}",
          "driver": {
            "name": "qemu",
            "type": "{{ 'raw' if vol.item[1].vdiskformat is defined and vol.item[1].vdiskformat == 'raw' else 'qcow2' }}",
            "discard": "unmap"
          },
          "target": { "dev": "{{ _dev }}" },
          "serial": "{{ vol.item[1].device_name }}"
        }{{ "," if not loop.last else "" }}
        {%- endfor -%}
        {%- endif -%}
      ]
    _tagslabels:
      cv__app_version: "{{cluster_vars[buildenv].hosttype_vars[item.hosttype].version | default(omit)}}"
      cv__cluster_suffix: "{{cluster_suffix}}"
      cv__hosttype: "{{item.hosttype}}"
      cv__lifecycle_state: "current"
      cv__regionzone: "{{item.region}}-{{item.az_name}}"    # cv__regionzone needed here for libvirt because libvirt doesn't store zone metadata natively

#- name: create/libvirt | Wait for virt_install to complete
#  async_status: { jid: "{{ item.ansible_job_id }}" }
#  register: r__async_status__virt_install
#  until: r__async_status__virt_install.finished
#  retries: 40
#  delay: 10
#  loop: "{{ r__virt_install.results }}"

#- name: create/libvirt | debug r__async_status__virt_install
#  debug: msg={{r__async_status__virt_install}}

#- name: create/libvirt | debug r__virt_install
#  debug: msg={{r__virt_install}}

- name: create/libvirt | Set autostart if required
  community.libvirt.virt:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    name: "{{item.item.hostname}}"
    autostart: true
  with_items: "{{ r__virt_install.results }}"
  when: "'autostart' in item.item.flavor and item.item.flavor.autostart|bool"

- name: create/libvirt | Wait for all VMs to start (retry if fail)
  dseeley.libvirt.virt:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    name: "{{item.item.hostname}}"
    state: running
  register: r__virt__start_vms_async
  loop: "{{ r__virt_install.results }}"
  until: "r__virt__start_vms_async is not failed"
  retries: 10
  delay: 1

#- name: create/libvirt | debug r__virt__start_vms_async
#  debug: msg={{r__virt__start_vms_async}}

- name: create/libvirt | Wait until IPs are presented for all started VMs
  dseeley.libvirt.virt:
    uri: 'qemu+ssh://{{ cluster_vars.libvirt.username }}@{{ cluster_vars.libvirt.hypervisor }}/system?keyfile=id_rsa__cv_libvirt&no_verify=1'
    command: get_guest_agent_info
    name: "{{item.item.hostname}}"
  register: r__virt__guest_agent_info
  loop: "{{ r__virt_install.results }}"
  until: "(r__virt__guest_agent_info | json_query('guest_agent_info.interfaceAddresses.*.addrs') | length > 0)"
  retries: 36     #3 minutes (24*5s)
  delay: 5
