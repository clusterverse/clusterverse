---

- name: _add_src_diskinfo_to_cluster_hosts_target | cluster_hosts_state
  debug: msg={{cluster_hosts_state}}

- name: _add_src_diskinfo_to_cluster_hosts_target | Add the disk info from previous instances to cluster_hosts_target
  include_tasks: "{{ item__include_tasks }}"
  loop: "{{ query('first_found', params) }}"
  loop_control: { loop_var: item__include_tasks }   #This mechanism (to include_tasks only when the file exists), also creates a loop iterator 'item' that it sends to the included tasks.  If they also have loops, we otherwise get the warning: "The loop variable 'item' is already in use".
  vars: { params: { files: ["_add_src_diskinfo_to_cluster_hosts_target__{{cluster_vars.cloud_type}}.yml"], skip: true } }

- name: _add_src_diskinfo_to_cluster_hosts_target | cluster_hosts_target
  debug: msg={{cluster_hosts_target}}

- name: _add_src_diskinfo_to_cluster_hosts_target | assert that src disks were actually added
  ansible.builtin.assert:
    that: "{{ cluster_hosts_target | map(attribute='auto_volumes', default=[]) | flatten | selectattr('src', 'undefined') | length == 0 }}"
    fail_msg: "ERROR: No src disks were mapped from old cluster to new cluster - check for hostname and region mismatches"
